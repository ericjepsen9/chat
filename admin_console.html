<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatTrade 管理后台</title>
  <link rel="stylesheet" href="admin_console.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">ChatTrade 管理后台</div>
      <nav class="admin-nav">
        <button data-tab="overview" class="active">平台概览</button>
        <button data-tab="orders">平台订单</button>
        <button data-tab="users">用户管理</button>
        <button data-tab="products">商品管理</button>
        <button data-tab="broadcasts">广播中心</button>
        <button data-tab="risk">风控与举报</button>
      </nav>
      <div class="admin-side-footer">
        <button id="adminRefreshBtn">刷新数据</button>
        <a href="index.html" target="_blank" rel="noopener">打开用户端</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <h1 id="adminPageTitle">平台概览</h1>
          <p id="adminPageSub">桌面版独立管理网页</p>
        </div>
        <div class="admin-header-actions">
          <button id="adminLogoutBtn">清除本地登录态</button>
        </div>
      </header>

      <section id="tab-overview" class="admin-tab active">
        <div id="adminStatsGrid" class="stats-grid"></div>
        <div class="panel-row">
          <section class="panel">
            <div class="panel-title">最近订单</div>
            <div id="adminRecentOrders"></div>
          </section>
          <section class="panel">
            <div class="panel-title">平台提醒</div>
            <div id="adminRiskSummary"></div>
          </section>
        </div>
      </section>

      <section id="tab-orders" class="admin-tab">
        <div class="panel">
          <div class="panel-title">全部订单</div>
          <div id="adminOrdersTable"></div>
        </div>
      </section>

      <section id="tab-users" class="admin-tab">
        <div class="panel">
          <div class="panel-title">用户列表</div>
          <div id="adminUsersTable"></div>
        </div>
      </section>

      <section id="tab-products" class="admin-tab">
        <div class="panel">
          <div class="panel-title">商品列表</div>
          <div id="adminProductsTable"></div>
        </div>
      </section>

      <section id="tab-broadcasts" class="admin-tab">
        <div class="panel">
          <div class="panel-title">广播中心</div>
          <div class="admin-form-grid">
            <input id="broadcastTitle" placeholder="广播标题" />
            <input id="broadcastSummary" placeholder="广播摘要" />
          </div>
          <textarea id="broadcastContent" placeholder="广播内容（简要）"></textarea>
          <div class="toolbar">
            <button id="adminSaveBroadcastDraftBtn">保存草稿</button>
            <button id="adminSendBroadcastBtn" class="primary">发送到当前会话（需用户端）</button>
          </div>
          <div id="adminBroadcastDrafts"></div>
        </div>
      </section>

      <section id="tab-risk" class="admin-tab">
        <div class="panel">
          <div class="panel-title">风控与举报</div>
          <div id="adminRiskTable"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="admin_console.js"></script>
</body>
</html>
