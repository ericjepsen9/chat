<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatTrade 管理后台</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self';" />
<link rel="stylesheet" href="admin_console.css?v=40.0">
</head>
<body>
<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">CT</div>
    <div class="login-title">ChatTrade 管理后台</div>
    <div class="login-subtitle">请使用管理员账号登录</div>
    <div id="loginError" class="login-error hidden"></div>
    <input id="loginUser" type="text" placeholder="管理员账号" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn" class="btn-primary btn-full">登 录</button>
  </div>
</div>

<!-- Main App -->
<div id="appShell" class="app-shell hidden">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">CT</span>
      <span class="brand-text">管理后台</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-tab="dashboard"><span class="nav-ico">📊</span>数据概览</a>
      <a class="nav-item" data-tab="users"><span class="nav-ico">👥</span>用户管理</a>
      <a class="nav-item" data-tab="orders"><span class="nav-ico">📋</span>订单管理</a>
      <a class="nav-item" data-tab="products"><span class="nav-ico">🏪</span>商品管理</a>
      <a class="nav-item" data-tab="conversations"><span class="nav-ico">💬</span>会话消息</a>
      <a class="nav-item" data-tab="broadcast"><span class="nav-ico">📢</span>广播中心</a>
      <a class="nav-item" data-tab="friends"><span class="nav-ico">🤝</span>好友关系</a>
      <a class="nav-item" data-tab="sessions"><span class="nav-ico">🔐</span>会话/在线</a>
      <a class="nav-item" data-tab="msgSearch"><span class="nav-ico">🔍</span>消息搜索</a>
      <a class="nav-item" data-tab="system"><span class="nav-ico">⚙️</span>系统信息</a>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-info" id="adminInfo"></div>
      <button id="sidebarChangePasswordBtn" class="btn-sidebar" style="margin-bottom:6px">修改密码</button>
      <button id="logoutBtn" class="btn-sidebar">退出登录</button>
    </div>
  </aside>

  <!-- Content -->
  <main class="main-content">
    <header class="top-bar">
      <button id="menuToggle" class="menu-toggle">☰</button>
      <h1 id="pageTitle" class="page-title">数据概览</h1>
      <div class="top-actions">
        <button id="autoRefreshBtn" class="btn-outline btn-sm">自动刷新:关</button>
        <button id="refreshBtn" class="btn-outline btn-sm">刷新</button>
      </div>
    </header>

    <!-- Dashboard -->
    <section id="tab-dashboard" class="tab-pane active">
      <div class="stats-row" id="statsRow"></div>
      <div class="grid-2">
        <div class="card"><div class="card-title">7日趋势</div><div id="trendChart" class="chart-wrap"></div></div>
        <div class="card"><div class="card-title">订单状态分布</div><div id="orderPie" class="chart-wrap"></div></div>
      </div>
      <div class="card"><div class="card-title">最近订单</div><div id="recentOrders"></div></div>
    </section>

    <!-- Users -->
    <section id="tab-users" class="tab-pane">
      <div class="toolbar">
        <input id="userSearch" class="search-input" placeholder="搜索用户名/昵称/手机号/APP号...">
        <select id="userStatusFilter" class="filter-sel"><option value="">全部状态</option><option value="active">正常</option><option value="disabled">已禁用</option></select>
        <select id="userRoleFilter" class="filter-sel"><option value="">全部角色</option><option value="admin">管理员</option><option value="user">普通用户</option></select>
        <button id="createUserBtn" class="btn-primary btn-sm">+ 创建用户</button>
        <button id="exportUsersBtn" class="btn-outline btn-sm">导出CSV</button>
      </div>
      <div id="usersTable"></div>
      <div id="usersPager" class="pager"></div>
    </section>

    <!-- Orders -->
    <section id="tab-orders" class="tab-pane">
      <div class="toolbar">
        <input id="orderSearch" class="search-input" placeholder="搜索订单号/买家/卖家...">
        <select id="orderStatusFilter" class="filter-sel"><option value="">全部状态</option><option value="pending">待处理</option><option value="accepted">已接单</option><option value="processing">处理中</option><option value="in_progress">进行中</option><option value="completed">已完成</option></select>
        <input id="orderDateFrom" type="date" class="filter-sel" title="起始日期">
        <input id="orderDateTo" type="date" class="filter-sel" title="截止日期">
        <button id="applyOrderDateFilterBtn" class="btn-outline btn-sm">按日期筛选</button>
        <button id="exportOrdersBtn" class="btn-outline btn-sm">导出CSV</button>
      </div>
      <div id="ordersTable"></div>
      <div id="ordersPager" class="pager"></div>
    </section>

    <!-- Products -->
    <section id="tab-products" class="tab-pane">
      <div class="toolbar">
        <input id="productSearch" class="search-input" placeholder="搜索商品名/卖家/分类...">
        <select id="productListedFilter" class="filter-sel"><option value="">全部状态</option><option value="true">已上架</option><option value="false">已下架</option></select>
      </div>
      <div id="productsTable"></div>
      <div id="productsPager" class="pager"></div>
    </section>

    <!-- Conversations -->
    <section id="tab-conversations" class="tab-pane">
      <div class="toolbar">
        <input id="convSearch" class="search-input" placeholder="搜索会话成员...">
        <select id="convTypeFilter" class="filter-sel"><option value="">全部类型</option><option value="direct">私聊</option><option value="group">群聊</option></select>
      </div>
      <div id="convsTable"></div>
      <div id="convsPager" class="pager"></div>
    </section>

    <!-- Broadcast -->
    <section id="tab-broadcast" class="tab-pane">
      <div class="grid-2">
        <div class="card">
          <div class="card-title">发布系统广播</div>
          <div class="form-group"><label>标题</label><input id="bcTitle" placeholder="消息标题" maxlength="80"></div>
          <div class="form-group"><label>摘要</label><textarea id="bcSummary" rows="3" placeholder="消息摘要内容" maxlength="240"></textarea></div>
          <div class="form-group"><label>封面图URL（可选）</label><input id="bcCover" placeholder="https://..." maxlength="512"></div>
          <div class="form-actions"><button id="bcPublishBtn" class="btn-primary">发布广播</button></div>
        </div>
        <div class="card">
          <div class="card-title">广播历史</div>
          <div id="broadcastHistory"></div>
        </div>
      </div>
    </section>

    <!-- Friends -->
    <section id="tab-friends" class="tab-pane">
      <div class="grid-2">
        <div class="card">
          <div class="card-title">好友关系列表</div>
          <div class="toolbar"><input id="friendSearch" class="search-input" placeholder="搜索用户名..."></div>
          <div id="friendsTable"></div>
          <div id="friendsPager" class="pager"></div>
        </div>
        <div class="card">
          <div class="card-title">好友请求记录</div>
          <div class="toolbar">
            <select id="friendReqStatusFilter" class="filter-sel"><option value="">全部状态</option><option value="pending">待处理</option><option value="accepted">已接受</option><option value="rejected">已拒绝</option></select>
          </div>
          <div id="friendRequestsTable"></div>
          <div id="friendRequestsPager" class="pager"></div>
        </div>
      </div>
    </section>

    <!-- Sessions -->
    <section id="tab-sessions" class="tab-pane">
      <div class="grid-2">
        <div class="card">
          <div class="card-title">活跃会话</div>
          <div class="toolbar"><input id="sessionSearch" class="search-input" placeholder="搜索用户名..."></div>
          <div id="sessionsTable"></div>
          <div id="sessionsPager" class="pager"></div>
        </div>
        <div class="card">
          <div class="card-title">在线用户</div>
          <div id="onlineUsersPanel"></div>
        </div>
      </div>
    </section>

    <!-- Message Search -->
    <section id="tab-msgSearch" class="tab-pane">
      <div class="toolbar"><input id="msgSearchInput" class="search-input" placeholder="搜索消息内容（至少2个字符）..."></div>
      <div class="card">
        <div class="card-title">搜索结果</div>
        <div id="msgSearchResults"><div class="empty">请输入关键词搜索</div></div>
      </div>
    </section>

    <!-- System -->
    <section id="tab-system" class="tab-pane">
      <div class="grid-2">
        <div class="card">
          <div class="card-title">服务器信息</div>
          <div id="systemInfoPanel"></div>
        </div>
        <div class="card">
          <div class="card-title">管理员操作</div>
          <div class="form-actions" style="margin-bottom:14px">
            <button id="sysChangePasswordBtn" class="btn-primary btn-sm">修改密码</button>
          </div>
          <div class="card-title">操作日志</div>
          <div id="auditLogPanel"><div class="empty">暂无记录</div></div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="modal-x" id="modalCloseBtn">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFooter"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script defer src="admin_console.js?v=40.1"></script>
<script defer src="admin_console_ext.js?v=40.0"></script>
<script defer src="admin_console_adv.js?v=40.0"></script>
</body>
</html>
